[package]
name = "velos-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Velos container-runtime seam and its backends."

[lints]
workspace = true

[dependencies]
velos-models = { workspace = true }
async-trait = "0.1"
thiserror = "2.0"
tokio = { version = "1", features = ["process", "rt", "macros", "sync", "time", "io-util", "net", "fs"] }
serde_json = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
